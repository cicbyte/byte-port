name: Tag Release

# 一键发版入口：无需本地查 tag/打 tag——版本号由 git-cliff 按提交语义自动推导
# （有 feat → minor，仅 fix/chore → patch），也支持显式指定。tag 就绪后由本流
# 显式 dispatch Release 完成构建与发布。
# 前置约定：提交遵循 conventional commits（feat/fix/chore/...）。
# （方案参考 byte-git 同名工作流，适配：无 tauri，主分支 main）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号：留空=自动推导；或 patch/minor/major 强制档位；或完整版本号如 0.2.0（不带 v）'
        required: false
        default: ''

permissions:
  contents: write
  actions: write  # dispatch Release 需要（仅 contents 不够）

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # cliff 推导需要全历史与全部 tag
          fetch-tags: true
          persist-credentials: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve next version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -z "$INPUT" ]; then
            # 按提交语义自动推导
            V=$(git-cliff --bumped-version 2>/dev/null | tr -d '[:space:]')
          elif echo "$INPUT" | grep -qE '^(patch|minor|major)$'; then
            V=$(git-cliff --bump "$INPUT" --bumped-version | tr -d '[:space:]')
          else
            V="$INPUT"
          fi
          if [ -z "$V" ]; then
            echo "无法确定版本号（可能是首个 tag，请显式填写 version）" && exit 1
          fi
          # git-cliff 部分版本输出带 v 前缀，统一剥掉防拼出 vv*
          V=${V#v}
          # 防 dedup：目标 tag 已存在则拒绝
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "tag v$V 已存在，拒绝重复发版" && exit 1
          fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "下一版本：v$V"

      # 根 Cargo.toml 的 [workspace.package].version 是全 workspace 唯一版本源
      # （core / gui / cli 均 version.workspace = true），bump 一处全生效。
      # 先提交 bump 再打 tag，tag 指向 bump 提交，二进制版本才对。
      - name: Bump Cargo.toml and tag
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          # 只替换首个行首 version（即 workspace.package 段），不碰依赖的行内 version
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" Cargo.toml
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "chore(release): bump version to $V"
          git push origin HEAD:master
          git tag -a "v$V" -m "release v$V"
          git push origin "v$V"

      # GITHUB_TOKEN 推送的 tag 不会触发其他工作流（GitHub 防递归限制）——
      # 必须在此显式 dispatch Release
      - name: Trigger Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5  # 等 tag 推送传播
          gh workflow run Release --ref master \
            -f tag="v${{ steps.ver.outputs.VERSION }}"
          echo "Release 工作流已触发（v${{ steps.ver.outputs.VERSION }}）"
